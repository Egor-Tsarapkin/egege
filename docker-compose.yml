name: egege

services:
  egege:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
  kege-sync:
    build:
      context: .
      target: kege-sync
    profiles: ["tools"]
    volumes:
      - ./public:/app/public
  realtime:
    build:
      context: .
      target: realtime
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      - egege
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - egege
      - realtime
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
